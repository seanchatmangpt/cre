# ============================================================================
# Configuration
# ============================================================================
options:
  machineType: N1_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

  # Container Registry or Artifact Registry
  substitution_option: ALLOW_LOOSE

# ============================================================================
# Build Substitutions (provided by GitHub Actions or gcloud CLI)
# ============================================================================
substitutions:
  _IMAGE_NAME: 'us-central1-docker.pkg.dev/${PROJECT_ID}/cre/cre'
  _VERSION: '0.3.0'
  _COMMIT_SHA: 'dev'
  _BUILD_DATE: '2025-01-01T00:00:00Z'
  _GCS_BUCKET: '${PROJECT_ID}-cre-artifacts'

# ============================================================================
# Artifact Configuration
# ============================================================================
artifacts:
  objects:
    location: 'gs://${_GCS_BUCKET}/build-artifacts/${_VERSION}/${_COMMIT_SHA}'
    paths:
      # SBOM Artifacts
      - 'sbom.spdx.json'
      - 'sbom.cyclonedx.json'
      - 'sbom.cyclonedx.xml'
      - 'sbom-manifest.json'
      # Trivy Security Scanning Artifacts
      - 'trivy-results.json'
      - 'trivy-summary.json'
      - 'trivy-results.sarif'
      - 'trivy-report.html'
      # Marketplace Compliance Artifacts
      - 'marketplace-compliance-report.json'

# ============================================================================
# Build Configuration
# ============================================================================
timeout: 3600s
queueTtl: 604800s

# ============================================================================
# Images to push to Artifact Registry
# ============================================================================
images:
  - ${_IMAGE_NAME}:${_VERSION}
  - ${_IMAGE_NAME}:latest

# ============================================================================
# On-Failure Behavior
# ============================================================================
onFailure:
  - logFailure
