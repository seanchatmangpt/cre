# Grafana Datasource Provisioning Configuration
#
# This file auto-configures Prometheus as a datasource in Grafana.
# Place in: /etc/grafana/provisioning/datasources/prometheus.yml

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    jsonData:
      httpMethod: POST
      timeInterval: 15s
    editable: true
    isDefault: true
    uid: prometheus
