---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cre-ingress
  namespace: cre-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - cre.example.com
        - api.cre.example.com
      secretName: cre-tls
  rules:
    - host: cre.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142
    - host: api.cre.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cre-ingress
  namespace: cre-staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - cre-staging.example.com
      secretName: cre-staging-tls
  rules:
    - host: cre-staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142
