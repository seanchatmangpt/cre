apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cre-network-policy
  namespace: cre
spec:
  podSelector:
    matchLabels:
      app: cre
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cre
    ports:
    - protocol: TCP
      port: 4142
    - protocol: TCP
      port: 9100  # Erlang distribution port
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: cre
    ports:
    - protocol: TCP
      port: 4368  # EPMD
    - protocol: TCP
      port: 9100  # Erlang distribution
