apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cre
  labels:
    app: cre
    component: workflow-engine
spec:
  serviceName: cre-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: cre
  template:
    metadata:
      labels:
        app: cre
        component: workflow-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4142"
        prometheus.io/path: "/status.json"
    spec:
      serviceAccountName: cre
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: init-mnesia
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "Initializing Mnesia data directory..."
              mkdir -p /opt/cre/data/mnesia
              chown -R 1000:1000 /opt/cre/data
              chmod -R 755 /opt/cre/data
              echo "Mnesia data directory initialized"
          volumeMounts:
            - name: mnesia-data
              mountPath: /opt/cre/data
      containers:
        - name: cre
          image: cre:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4142
              protocol: TCP
            - name: epmd
              containerPort: 4368
              protocol: TCP
            - name: dist
              containerPort: 9100
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ERLANG_NODE
              value: "cre@$(POD_NAME).cre-headless.$(POD_NAMESPACE).svc.cluster.local"
            - name: CRE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: cre-secrets
                  key: erlang-cookie
            - name: CRE_DEFAULT_PORT
              value: "4142"
            - name: CRE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: log-level
            - name: MNESIA_DIR
              value: "/opt/cre/data/mnesia"
            - name: RELX_REPLACE_OS_VARS
              value: "true"
            - name: ERL_MAX_PORTS
              value: "65536"
            - name: ERL_MAX_ETS_TABLES
              value: "2000"
          envFrom:
            - configMapRef:
                name: cre-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: mnesia-data
              mountPath: /opt/cre/data
            - name: checkpoints
              mountPath: /opt/cre/checkpoints
          livenessProbe:
            httpGet:
              path: /status.json
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.json
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /status.json
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    /opt/cre/bin/cre stop &
                    sleep 15
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: mnesia-data
        labels:
          app: cre
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
