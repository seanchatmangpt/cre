---
# IMPORTANT: This is a template file for Kubernetes secrets.
# DO NOT commit actual secrets to version control.
#
# To create the actual secret, use one of these methods:
#
# Method 1: From literal values
# kubectl create secret generic cre-secrets \
#   --from-literal=erlang-cookie=$(openssl rand -base64 32) \
#   --from-literal=db-password=$(openssl rand -base64 16) \
#   --namespace=cre
#
# Method 2: From file
# kubectl create secret generic cre-secrets \
#   --from-file=erlang-cookie=./erlang.cookie \
#   --namespace=cre
#
# Method 3: Seal it with Sealed Secrets (recommended for production)
# kubeseal -f k8s/base/secret.yaml -w k8s/production/sealed-secret.yaml
#
# Required Secrets:
# -----------------
# erlang-cookie    - Erlang distribution cookie (must match across all nodes)
#                     Generate with: openssl rand -base64 32
#
# db-password      - Database password (if using external database)
#                     Generate with: openssl rand -base64 16
#
# api-key          - API authentication key (optional)
#                     Generate with: openssl rand -base64 32
#
# backup-key       - Backup encryption key (for encrypted backups)
#                     Generate with: openssl rand -base64 64

apiVersion: v1
kind: Secret
metadata:
  name: cre-secrets
  labels:
    app: cre
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values with actual secrets
  # before deploying to production!
  erlang-cookie: "CHANGE_ME_GENERATE_WITH_openssl_rand-base64_32"
  db-password: "CHANGE_ME_GENERATE_WITH_openssl_rand-base64_16"
  api-key: "CHANGE_ME_GENERATE_WITH_openssl_rand-base64_32"
  backup-key: "CHANGE_ME_GENERATE_WITH_openssl_rand-base64_64"

---
# Optional: Sealed Secret Template (requires Sealed Secrets controller)
#
# To use:
# 1. Install Sealed Secrets controller: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
# 2. Generate sealed secret: kubeseal -f k8s/base/secret.yaml -w k8s/production/sealed-secret.yaml
# 3. Apply sealed secret: kubectl apply -f k8s/production/sealed-secret.yaml
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: cre-secrets
#   labels:
#     app: cre
# spec:
#   template:
#     metadata:
#       name: cre-secrets
#       labels:
#         app: cre
#     type: Opaque
#   encryptedData:
#     erlang-cookie: AGBy3... (sealed value)
#     db-password: AGBy3... (sealed value)
#     api-key: AGBy3... (sealed value)
