---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cre
  labels:
    app: cre
    component: workflow-engine
---
# Role for CRE pod operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cre
  labels:
    app: cre
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
# RoleBinding for CRE service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cre
  labels:
    app: cre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cre
subjects:
  - kind: ServiceAccount
    name: cre
