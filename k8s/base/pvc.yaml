---
# PersistentVolumeClaim for additional CRE data storage
# This is used alongside the StatefulSet volumeClaimTemplate
# for optional additional storage needs (backups, exports, etc.)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cre-data-pvc
  labels:
    app: cre
    component: workflow-engine
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
  # Uncomment if using a specific storage class
  # storageClassName: nfs-storage
