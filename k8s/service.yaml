---
apiVersion: v1
kind: Service
metadata:
  name: cre
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 4142
      targetPort: http
      protocol: TCP
    - name: epmd
      port: 4369
      targetPort: epmd
      protocol: TCP
    - name: dist
      port: 9100
      targetPort: dist
      protocol: TCP
  selector:
    app: cre
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: cre-headless
  namespace: cre-prod
  labels:
    app: cre
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 4142
      targetPort: http
      protocol: TCP
    - name: epmd
      port: 4369
      targetPort: epmd
      protocol: TCP
    - name: dist
      port: 9100
      targetPort: dist
      protocol: TCP
  selector:
    app: cre

---
