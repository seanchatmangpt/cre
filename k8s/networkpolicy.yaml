---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cre-network-policy
  namespace: cre-prod
spec:
  podSelector:
    matchLabels:
      app: cre
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4142
    # Allow Erlang distribution from other CRE pods
    - from:
        - podSelector:
            matchLabels:
              app: cre
      ports:
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 9100
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 4142
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Erlang distribution to other CRE pods
    - to:
        - podSelector:
            matchLabels:
              app: cre
      ports:
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 9100
    # Allow outbound HTTPS (for API calls, package downloads, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Allow OpenTelemetry export
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cre-network-policy
  namespace: cre-staging
spec:
  podSelector:
    matchLabels:
      app: cre
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4142
    - from:
        - podSelector:
            matchLabels:
              app: cre
      ports:
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: cre
      ports:
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 9100
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
