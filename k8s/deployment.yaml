---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cre
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cre
  template:
    metadata:
      labels:
        app: cre
        component: workflow-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4142"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Init containers
      initContainers:
        - name: init-directories
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/cre/data /opt/cre/log /opt/cre/checkpoints
              chown -R 1000:1000 /opt/cre
          volumeMounts:
            - name: data
              mountPath: /opt/cre/data
            - name: logs
              mountPath: /opt/cre/log
            - name: checkpoints
              mountPath: /opt/cre/checkpoints

      containers:
        - name: cre
          image: ghcr.io/joergen7/cre:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4142
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: 9100
              protocol: TCP

          env:
            - name: CRE_DEFAULT_PORT
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: CRE_DEFAULT_PORT
            - name: CRE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: CRE_LOG_LEVEL
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: cre-secrets
                  key: erlang-cookie
            - name: YAWL_STATELESS_CHECKPOINT_DIR
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: YAWL_STATELESS_CHECKPOINT_DIR

          # Resource limits
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          startupProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          # Volume mounts
          volumeMounts:
            - name: data
              mountPath: /opt/cre/data
            - name: logs
              mountPath: /opt/cre/log
            - name: checkpoints
              mountPath: /opt/cre/checkpoints

          # Lifecycle hooks
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # CRE GKE Pre-Stop Hook with Graceful Shutdown
                    # Ensures active workflows complete before termination
                    #
                    # Environment Variables:
                    #   CRE_SHUTDOWN_PORT - HTTP port for shutdown API (default: 4142)
                    #   CRE_SHUTDOWN_TIMEOUT - Max wait time for shutdown (default: 25s)

                    set -eo pipefail

                    CRE_SHUTDOWN_PORT="${CRE_SHUTDOWN_PORT:-4142}"
                    CRE_SHUTDOWN_TIMEOUT="${CRE_SHUTDOWN_TIMEOUT:-25}"
                    CRE_HOME="/opt/cre"

                    echo "[CRE PRE-STOP] Initiating graceful shutdown (timeout: ${CRE_SHUTDOWN_TIMEOUT}s)"

                    # Trigger shutdown via Erlang RPC
                    "${CRE_HOME}/bin/cre" eval \
                        "cre_graceful_shutdown:initiate_shutdown(${CRE_SHUTDOWN_TIMEOUT}000, gke_preemption)." 2>/dev/null || true

                    echo "[CRE PRE-STOP] Shutdown initiated, waiting for workflows..."

                    # Wait for active workflows to complete
                    sleep 5

                    # Verify workflow count
                    "${CRE_HOME}/bin/cre" eval \
                        "io:format(\"Active workflows: ~p~n\", [cre_graceful_shutdown:get_active_workflow_count()])." 2>/dev/null || true

                    echo "[CRE PRE-STOP] Pre-stop hook completed"

      # Volumes
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: checkpoints
          persistentVolumeClaim:
            claimName: cre-checkpoints-pvc

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# Staging deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cre
  namespace: cre-staging
  labels:
    app: cre
    component: workflow-engine
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cre
  template:
    metadata:
      labels:
        app: cre
        component: workflow-engine
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4142"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      initContainers:
        - name: init-directories
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/cre/data /opt/cre/log /opt/cre/checkpoints
              chown -R 1000:1000 /opt/cre
          volumeMounts:
            - name: data
              mountPath: /opt/cre/data
            - name: logs
              mountPath: /opt/cre/log
            - name: checkpoints
              mountPath: /opt/cre/checkpoints

      containers:
        - name: cre
          image: ghcr.io/joergen7/cre:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4142
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: 9100
              protocol: TCP

          env:
            - name: CRE_DEFAULT_PORT
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: CRE_DEFAULT_PORT
            - name: CRE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: CRE_LOG_LEVEL
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: cre-secrets
                  key: erlang-cookie
            - name: YAWL_STATELESS_CHECKPOINT_DIR
              valueFrom:
                configMapKeyRef:
                  name: cre-config
                  key: YAWL_STATELESS_CHECKPOINT_DIR

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          volumeMounts:
            - name: data
              mountPath: /opt/cre/data
            - name: logs
              mountPath: /opt/cre/log
            - name: checkpoints
              mountPath: /opt/cre/checkpoints

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # CRE GKE Pre-Stop Hook with Graceful Shutdown (Staging)
                    CRE_SHUTDOWN_PORT="${CRE_SHUTDOWN_PORT:-4142}"
                    CRE_SHUTDOWN_TIMEOUT="${CRE_SHUTDOWN_TIMEOUT:-25}"
                    CRE_HOME="/opt/cre"

                    echo "[CRE PRE-STOP] Initiating graceful shutdown (timeout: ${CRE_SHUTDOWN_TIMEOUT}s)"

                    "${CRE_HOME}/bin/cre" eval \
                        "cre_graceful_shutdown:initiate_shutdown(${CRE_SHUTDOWN_TIMEOUT}000, gke_preemption)." 2>/dev/null || true

                    echo "[CRE PRE-STOP] Shutdown initiated, waiting for workflows..."
                    sleep 5
                    echo "[CRE PRE-STOP] Pre-stop hook completed"

      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: checkpoints
          emptyDir: {}

      terminationGracePeriodSeconds: 30

---
# ConfigMap for graceful shutdown script (can be mounted as volume)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cre-graceful-scripts
  namespace: cre-prod
data:
  gcp-pre-stop.sh: |
    #!/bin/bash
    # CRE GKE Pre-Stop Hook Script
    # Triggers graceful shutdown before Kubernetes terminates the pod
    #
    # Environment Variables:
    #   CRE_NODE_NAME    - Erlang node name (default: cre)
    #   CRE_HOSTNAME     - Node hostname (default: hostname -f)
    #   CRE_SHUTDOWN_PORT - HTTP port for shutdown API (default: 4142)
    #   CRE_SHUTDOWN_TIMEOUT - Max wait time for shutdown (default: 25s)
    #   CRE_COOKIE       - Erlang cookie for clustering

    set -eo pipefail

    CRE_NODE_NAME="${CRE_NODE_NAME:-cre}"
    CRE_SHUTDOWN_PORT="${CRE_SHUTDOWN_PORT:-4142}"
    CRE_SHUTDOWN_TIMEOUT="${CRE_SHUTDOWN_TIMEOUT:-25}"
    CRE_HOME="/opt/cre"

    echo "[CRE PRE-STOP] Initiating graceful shutdown for ${CRE_NODE_NAME}"
    echo "[CRE PRE-STOP] Timeout: ${CRE_SHUTDOWN_TIMEOUT}s"

    # Trigger shutdown via Erlang RPC
    "${CRE_HOME}/bin/cre" eval \
        "cre_graceful_shutdown:initiate_shutdown(${CRE_SHUTDOWN_TIMEOUT}000, gke_preemption)." 2>/dev/null || true

    echo "[CRE PRE-STOP] Shutdown initiated, waiting for workflows..."

    # Wait for active workflows to complete
    sleep 5

    # Get final workflow count
    "${CRE_HOME}/bin/cre" eval \
        "io:format(\"Active workflows: ~p~n\", [cre_graceful_shutdown:get_active_workflow_count()])." 2>/dev/null || true

    echo "[CRE PRE-STOP] Pre-stop hook completed"
