---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cre-config
  namespace: cre-prod
data:
  # CRE Configuration
  CRE_DEFAULT_PORT: "4142"
  CRE_CLIENT_POLL_INTERVAL: "250"
  CRE_LOG_LEVEL: "info"

  # YAWL Configuration
  YAWL_STATELESS_CHECKPOINT_DIR: "/opt/cre/checkpoints"
  YAWL_STATELESS_MAX_EXECUTIONS: "1000"
  YAWL_TIMEOUT_DEFAULT_TIMEOUT: "30000"

  # OpenTelemetry Configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "cre-workflow-engine"
  OTEL_RESOURCE_ATTRIBUTES: "service.name=cre,deployment.environment=production"

  # GCP Service Discovery Configuration
  CRE_SERVICE_NAME: "cre-service"
  CRE_NAMESPACE: "cre-prod"
  CRE_NODE_NAME: "cre"
  CRE_CLUSTER_DISCOVERY_METHOD: "gcp"
  CRE_DNS_DOMAIN: "cluster.local"
  CRE_CLUSTER_MAX_RETRIES: "5"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cre-config
  namespace: cre-staging
data:
  # CRE Configuration
  CRE_DEFAULT_PORT: "4142"
  CRE_CLIENT_POLL_INTERVAL: "250"
  CRE_LOG_LEVEL: "debug"

  # YAWL Configuration
  YAWL_STATELESS_CHECKPOINT_DIR: "/opt/cre/checkpoints"
  YAWL_STATELESS_MAX_EXECUTIONS: "500"
  YAWL_TIMEOUT_DEFAULT_TIMEOUT: "30000"

  # OpenTelemetry Configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "cre-workflow-engine-staging"
  OTEL_RESOURCE_ATTRIBUTES: "service.name=cre,deployment.environment=staging"

  # GCP Service Discovery Configuration
  CRE_SERVICE_NAME: "cre-service-staging"
  CRE_NAMESPACE: "cre-staging"
  CRE_NODE_NAME: "cre"
  CRE_CLUSTER_DISCOVERY_METHOD: "gcp"
  CRE_DNS_DOMAIN: "cluster.local"
  CRE_CLUSTER_MAX_RETRIES: "3"
