---
# IMPORTANT: This is a template. Actual secrets should be created using:
# kubectl create secret generic cre-secrets \
#   --from-literal=erlang-cookie='<your-cookie>' \
#   --from-literal=db-password='<your-db-password>' \
#   --from-literal=api-key='<your-api-key>' \
#   -n cre-prod

apiVersion: v1
kind: Secret
metadata:
  name: cre-secrets
  namespace: cre-prod
type: Opaque
stringData:
  # Erlang distribution cookie (must be consistent across all nodes)
  erlang-cookie: "change-me-in-production-use-openssl-rand-base64-32"

  # Database password (if using external Mnesia or database)
  db-password: "change-me-in-production"

  # API authentication key
  api-key: "change-me-in-production"

---
apiVersion: v1
kind: Secret
metadata:
  name: cre-secrets
  namespace: cre-staging
type: Opaque
stringData:
  # Staging secrets (use different values from production)
  erlang-cookie: "staging-cookie-change-me"
  db-password: "staging-db-password"
  api-key: "staging-api-key"
