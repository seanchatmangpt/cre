apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cre.fullname" . }}
  labels:
    {{- include "cre.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cre.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      {{- include "cre.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cre.selectorLabels" . | nindent 8 }}
        component: workflow-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: "/status.json"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cre.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-mnesia
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "Initializing Mnesia data directory..."
              mkdir -p {{ include "cre.mnesiaDir" . }}
              chown -R {{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.fsGroup }} /opt/cre/data
              chmod -R 755 /opt/cre/data
              echo "Mnesia data directory initialized"
          volumeMounts:
            - name: mnesia-data
              mountPath: /opt/cre/data
            - name: license-data
              mountPath: /opt/cre/data/license
            - name: usage-data
              mountPath: /opt/cre/data/usage
        - name: accept-license
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "${CRE_LICENSE_ACCEPT_EULA}" = "true" ]; then
                mkdir -p /opt/cre/data/license
                cat > /opt/cre/data/license/eula_acceptance.json <<EOF
              {"accepted":true,"timestamp":$(date +%s),"version":"1.0","acceptor":"marketplace-deployment"}
              EOF
                echo "EULA accepted via Marketplace deployment"
                cat /opt/cre/data/license/eula_acceptance.json
              else
                echo "EULA not accepted, grace period will apply"
                mkdir -p /opt/cre/data/license
                cat > /opt/cre/data/license/eula_acceptance.json <<EOF
              {"accepted":false,"timestamp":0,"version":"1.0","acceptor":""}
              EOF
              fi
          env:
            - name: CRE_LICENSE_ACCEPT_EULA
              value: {{ .Values.license.acceptEula | quote }}
          volumeMounts:
            - name: license-data
              mountPath: /opt/cre/data/license
      volumes:
        - name: license-data
          emptyDir: {}
        - name: usage-data
          emptyDir: {}
      containers:
        - name: cre
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.defaultPort }}
              protocol: TCP
            - name: epmd
              containerPort: {{ .Values.service.epmdPort }}
              protocol: TCP
            - name: dist
              containerPort: {{ .Values.service.distPort }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ERLANG_NODE
              value: "cre@$(POD_NAME).{{ include "cre.fullname" . }}-headless.$(POD_NAMESPACE).svc.cluster.local"
            - name: CRE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (include "cre.fullname" .) }}
                  key: erlang-cookie
            - name: CRE_DEFAULT_PORT
              value: {{ .Values.config.defaultPort | quote }}
            - name: CRE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cre.fullname" . }}-config
                  key: log-level
            - name: MNESIA_DIR
              value: {{ include "cre.mnesiaDir" . }}
            - name: RELX_REPLACE_OS_VARS
              value: "true"
            - name: ERL_MAX_PORTS
              value: {{ .Values.erlang.maxPorts | quote }}
            - name: ERL_MAX_ETS_TABLES
              value: {{ .Values.erlang.maxEtsTables | quote }}
            - name: CRE_LICENSE_ACCEPT_EULA
              value: {{ .Values.license.acceptEula | quote }}
            - name: CRE_LICENSE_GRACE_PERIOD_DAYS
              value: {{ .Values.license.gracePeriodDays | quote }}
            - name: CRE_LICENSE_FILE
              value: {{ .Values.license.licenseFile | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "cre.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: mnesia-data
              mountPath: /opt/cre/data
            - name: checkpoints
              mountPath: {{ .Values.config.checkpointDir }}
            - name: license-data
              mountPath: /opt/cre/data/license
            - name: usage-data
              mountPath: /opt/cre/data/usage
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    /opt/cre/bin/cre stop &
                    sleep 15
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: mnesia-data
        labels:
          {{- include "cre.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
