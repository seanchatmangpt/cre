# GKE-specific values for CRE Helm chart
# Usage: helm install cre ./k8s/charts/cre -f ./k8s/charts/cre/values-gke.yaml

# -- GKE typically uses 3+ nodes for high availability
replicaCount: 3

image:
  # -- Use GCR or Artifact Registry
  repository: us-docker.pkg.dev/PROJECT_ID/cre/cre
  tag: "0.3.0"
  pullPolicy: Always

# -- GKE service account (use Workload Identity for production)
serviceAccount:
  create: true
  annotations:
    # -- Workload Identity annotation (replace with your GSA)
    iam.gke.io/gcp-service-account: cre-gsa@PROJECT_ID.iam.gserviceaccount.com

# -- RBAC is enabled by default on GKE
rbac:
  create: true

# -- GKE StorageClass options
# standard-rwo: standard persistent disk (pd-balanced)
# premium-rwo: SSD persistent disk (pd-ssd)
# standard: network storage (filestore)
persistence:
  enabled: true
  storageClass: premium-rwo
  accessModes:
    - ReadWriteOnce
  size: 20Gi

# -- Enable autoscaling for production
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15

# -- GKE Ingress with Cloud Armor
ingress:
  enabled: true
  className: "gce"
  annotations:
    # -- Cloud Armor security policy
    # ingress.gcp.cloudarmor.securityPolicy: cre-security-policy
    # -- Google Cloud Backend Config
    # kubernetes.io/ingress.global-static-ip-name: cre-static-ip
    # -- Cloud CDN
    # kubernetes.io/ingress.class: "gce-internal"
    networking.gke.io/managed-certificates: "cre-cert"
  hosts:
    - host: cre.example.com
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls:
    - secretName: cre-tls

# -- GKE affinity rules for distribution across zones
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cre
          topologyKey: topology.kubernetes.io/zone

# -- GKE node selector for regional clusters
nodeSelector:
  cloud.google.com/compute-class: "balanced"

# -- GKE tolerations for spot/preemptible nodes
tolerations:
  - key: "cloud.google.com/gke-preemptible"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# -- GKE monitoring integration
monitoring:
  enabled: true
  serviceMonitorLabels:
    release: prometheus
  interval: 30s
  scrapeTimeout: 10s

# -- Resource limits tuned for GKE e2/custom machine types
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# -- Pod Disruption Budget for GKE rolling updates
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# -- Health probe timeouts for GKE load balancers
probes:
  liveness:
    httpGet:
      path: /status.json
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /status.json
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    httpGet:
      path: /status.json
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
