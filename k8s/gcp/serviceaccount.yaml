---
# GKE Service Account for Workload Identity
# This Kubernetes service account is mapped to a GCP service account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cre-ksa
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
  annotations:
    # GKE Workload Identity annotation
    # Format: iam.gke.io/gcp-service-account: <GSA_EMAIL>@<PROJECT_ID>.iam.gserviceaccount.com
    iam.gke.io/gcp-service-account: "cre-prod-sa@REPLACE_WITH_YOUR_PROJECT_ID.iam.gserviceaccount.com"
    # Cloud Operations service account
    cloud.google.com/service-account: "cre-prod-sa@REPLACE_WITH_YOUR_PROJECT_ID.iam.gserviceaccount.com"
---
# GKE Service Account for Staging
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cre-ksa
  namespace: cre-staging
  labels:
    app: cre
    component: workflow-engine
    environment: staging
  annotations:
    iam.gke.io/gcp-service-account: "cre-staging-sa@REPLACE_WITH_YOUR_PROJECT_ID.iam.gserviceaccount.com"
    cloud.google.com/service-account: "cre-staging-sa@REPLACE_WITH_YOUR_PROJECT_ID.iam.gserviceaccount.com"

---
# Role for CRE to access Kubernetes resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cre-role
  namespace: cre-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding for Production
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cre-rolebinding
  namespace: cre-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cre-role
subjects:
  - kind: ServiceAccount
    name: cre-ksa
    namespace: cre-prod
---
# Role for Staging
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cre-role
  namespace: cre-staging
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding for Staging
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cre-rolebinding
  namespace: cre-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cre-role
subjects:
  - kind: ServiceAccount
    name: cre-ksa
    namespace: cre-staging
