---
# GKE Service Account for Workload Identity
# This Kubernetes service account is mapped to a GCP service account
# CRITICAL: Workload Identity (GCP Marketplace keyless auth requirement)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cre-ksa
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
  annotations:
    # CRITICAL: Workload Identity annotation maps K8s SA to GCP SA
    # Matches: google_service_account.gke_workload in Terraform security module
    # Format: <NAME_PREFIX>-gke-workload@<PROJECT_ID>.iam.gserviceaccount.com
    iam.gke.io/gcp-service-account: "cre-gke-workload@REPLACE_WITH_YOUR_PROJECT_ID.iam.gserviceaccount.com"
---
# GKE Service Account for Staging
# CRITICAL: Workload Identity (GCP Marketplace keyless auth requirement)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cre-ksa
  namespace: cre-staging
  labels:
    app: cre
    component: workflow-engine
    environment: staging
  annotations:
    # CRITICAL: Workload Identity annotation maps K8s SA to GCP SA
    # Matches: google_service_account.gke_workload in Terraform security module
    # Staging uses the same GCP SA (separate K8s namespaces provide isolation)
    iam.gke.io/gcp-service-account: "cre-gke-workload@REPLACE_WITH_YOUR_PROJECT_ID.iam.gserviceaccount.com"

---
# Role for CRE to access Kubernetes resources
# Principle of least privilege: only grant minimum required permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cre-role
  namespace: cre-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]  # Keep for ConfigMapWatcher pattern
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]  # Only get by name, no list/watch needed
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]  # Only get by name, clustering uses EPMD not pod list/watch
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]  # Leader election requires all
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]  # Service discovery requires list
---
# RoleBinding for Production
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cre-rolebinding
  namespace: cre-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cre-role
subjects:
  - kind: ServiceAccount
    name: cre-ksa
    namespace: cre-prod
---
# Role for Staging
# Principle of least privilege: only grant minimum required permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cre-role
  namespace: cre-staging
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]  # Keep for ConfigMapWatcher pattern
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]  # Only get by name, no list/watch needed
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]  # Only get by name, clustering uses EPMD not pod list/watch
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]  # Leader election requires all
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]  # Service discovery requires list
---
# RoleBinding for Staging
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cre-rolebinding
  namespace: cre-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cre-role
subjects:
  - kind: ServiceAccount
    name: cre-ksa
    namespace: cre-staging
