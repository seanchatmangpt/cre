---
# GKE Secret with External Secret Manager references
# This manifest uses External Secrets Operator to sync from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cre-gcp-secret-store
  namespace: cre-prod
spec:
  provider:
    gcpsm:
      projectID: REPLACE_WITH_YOUR_PROJECT_ID
      # Workload Identity authentication
      auth:
        workloadIdentity:
          clusterLocation: REPLACE_WITH_CLUSTER_REGION
          clusterName: REPLACE_WITH_CLUSTER_NAME
          clusterProjectID: REPLACE_WITH_PROJECT_ID
          # Service account email in GCP
          serviceAccountRef:
            name: cre-ksa
            namespace: cre-prod

---
# External Secret for Production
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cre-secrets
  namespace: cre-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cre-gcp-secret-store
    kind: SecretStore
  target:
    name: cre-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Erlang distribution cookie
        erlang-cookie: "{{ .erlang_cookie }}"
        # Database credentials (if using external database)
        db-password: "{{ .db_password | toString }}"
        # API keys
        api-key: "{{ .api_key }}"
  data:
    - secretKey: erlang_cookie
      remoteRef:
        key: cre-erlang-cookie
    - secretKey: db_password
      remoteRef:
        key: cre-db-password
    - secretKey: api_key
      remoteRef:
        key: cre-api-key

---
# External Secret Store for Staging
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cre-gcp-secret-store
  namespace: cre-staging
spec:
  provider:
    gcpsm:
      projectID: REPLACE_WITH_YOUR_PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REPLACE_WITH_CLUSTER_REGION
          clusterName: REPLACE_WITH_CLUSTER_NAME
          clusterProjectID: REPLACE_WITH_PROJECT_ID
          serviceAccountRef:
            name: cre-ksa
            namespace: cre-staging

---
# External Secret for Staging
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cre-secrets
  namespace: cre-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cre-gcp-secret-store
    kind: SecretStore
  target:
    name: cre-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        erlang-cookie: "{{ .erlang_cookie }}"
        db-password: "{{ .db_password | toString }}"
        api-key: "{{ .api_key }}"
  data:
    - secretKey: erlang_cookie
      remoteRef:
        key: cre-erlang-cookie-staging
    - secretKey: db_password
      remoteRef:
        key: cre-db-password-staging
    - secretKey: api_key
      remoteRef:
        key: cre-api-key-staging

---
# Fallback: Opaque Secret for local development
# ONLY use this if External Secrets Operator is not available
apiVersion: v1
kind: Secret
metadata:
  name: cre-secrets-fallback
  namespace: cre-prod
type: Opaque
stringData:
  # WARNING: Use External Secrets Operator with GCP Secret Manager in production
  erlang-cookie: "GENERATE_WITH: openssl rand -base64 32"
  db-password: "CHANGE_ME_IN_PRODUCTION"
  api-key: "CHANGE_ME_IN_PRODUCTION"
