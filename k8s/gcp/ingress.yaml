---
# GKE Ingress with Cloud Armor and Cloud CDN
# Uses GKE Ingress controller (Global External Application Load Balancer)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cre-ingress
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
  annotations:
    # GKE Ingress controller
    kubernetes.io/ingress.class: "gce"
    # GKE Global External Application Load Balancer
    kubernetes.io/ingress.global-static-ip-name: "cre-static-ip"
    # Cloud Armor security policy
    networking.gke.io/v1beta1.PreconfiguredCertificates: "cre-tls-cert"
    # SSL Policy
    networking.gke.io/ssl-policy: "cre-ssl-policy"
    # CDN configuration
    networking.gke.io/supported-cdn-features: "cache,static-ip"
    cloud.google.com/cloud-armor-policy: "cre-cloud-armor-policy"
    cloud.google.com/app-protocols: '{"4142":"HTTP"}'
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "cre-backend-config"}'
    # Google Cloud Managed Certificates
    cert-manager.io/cluster-issuer: "gke-certificate-manager"
    # Security headers
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://cre.example.com"
    # Rate limiting via Cloud Armor
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Proxy timeouts for long-running workflows
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # IAP configuration (if using Cloud IAP)
    # ingress.kubernetes.io/pre-shared-cert: "cre-cert"
spec:
  # TLS configuration using Google Managed Certificates
  tls:
    - hosts:
        - cre.example.com
        - api.cre.example.com
      secretName: cre-tls-secret
  rules:
    - host: cre.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142
    - host: api.cre.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142
          - path: /workflows
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142

---
# Managed Certificate for GKE
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: cre-managed-cert
  namespace: cre-prod
spec:
  domains:
    - cre.example.com
    - api.cre.example.com
  # Certificate provisioning options
  # issuanceRef:
  #   group: cert-manager.k8s.io
  #   kind: ClusterIssuer
  #   name: letsencrypt-prod

---
# Cloud Armor Security Policy Reference
# This must be created via gcloud CLI or Terraform
# gcloud compute security-policies create cre-cloud-armor-policy \
#   --description "CRE Workflow Engine Security Policy"
# gcloud compute security-policies rules create 1 \
#   --security-policy cre-cloud-armor-policy \
#   --expression "evaluatePreconfiguredExpr('ddos_v4_general_engineering_gke_static_ip_rules')"
# gcloud compute security-policies rules create 2 \
#   --security-policy cre-cloud-armor-policy \
#   --expression "origin.ip_address != 'BLOCKED_IP'" \
#   --action "deny-404"

---
# Staging Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cre-ingress
  namespace: cre-staging
  labels:
    app: cre
    environment: staging
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "cre-staging-static-ip"
    networking.gke.io/v1beta1.PreconfiguredCertificates: "cre-staging-tls-cert"
    cloud.google.com/backend-config: '{"default": "cre-backend-config-staging"}'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - cre-staging.example.com
      secretName: cre-staging-tls-secret
  rules:
    - host: cre-staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cre
                port:
                  number: 4142

---
# Managed Certificate for Staging
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: cre-managed-cert-staging
  namespace: cre-staging
spec:
  domains:
    - cre-staging.example.com
