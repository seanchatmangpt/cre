---
# GKE Horizontal Pod Autoscaler with Custom Metrics
# Uses Prometheus Adapter for business-logic based autoscaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cre-hpa-custom-metrics
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
    autoscaling: custom-metrics
  annotations:
    # Metric collection configuration for Prometheus Adapter
    metric-config.external.active-workflows.prometheus/prometheus: |
      {
        "query": "sum(cre_autoscaling_active_workflows)",
        "metricName": "active-workflows",
        "metricSelector": {
          "matchLabels": {
            "app": "cre"
          }
        }
      }
    metric-config.external.workflow-queue-depth.prometheus/prometheus: |
      {
        "query": "sum(cre_autoscaling_workflow_queue_depth)",
        "metricName": "workflow-queue-depth",
        "metricSelector": {
          "matchLabels": {
            "app": "cre"
          }
        }
      }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cre
  # Replica limits for GKE e2-medium node pool
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # -----------------------------------------------------------------
    # Primary: Scale based on active workflow count (business logic)
    # -----------------------------------------------------------------
    - type: Pods
      pods:
        metric:
          name: active_workflows
        target:
          type: AverageValue
          averageValue: "50"

    # -----------------------------------------------------------------
    # Secondary: Scale based on workflow queue depth
    # -----------------------------------------------------------------
    - type: Pods
      pods:
        metric:
          name: workflow_queue_depth
        target:
          type: AverageValue
          averageValue: "100"

    # -----------------------------------------------------------------
    # Tertiary: Scale based on Erlang process count (system resource)
    # -----------------------------------------------------------------
    - type: Pods
      pods:
        metric:
          name: erlang_process_count
        target:
          type: AverageValue
          averageValue: "50000"

    # -----------------------------------------------------------------
    # Fallback: CPU-based autoscaling (standard)
    # -----------------------------------------------------------------
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # -----------------------------------------------------------------
    # Fallback: Memory-based autoscaling
    # -----------------------------------------------------------------
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # -----------------------------------------------------------------
  # Scaling behavior policies to prevent thrashing
  # -----------------------------------------------------------------
  behavior:
    # Scale down settings (prevent too aggressive scale-down)
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes - wait before scaling down
      policies:
        - type: Percent
          value: 50  # Max 50% of pods can be scaled down
          periodSeconds: 60
        - type: Pods
          value: 2   # Or max 2 pods at a time
          periodSeconds: 60
        - type: Pods
          value: 1   # Conservative: 1 pod per minute
          periodSeconds: 30
      selectPolicy: Min  # Use the policy that changes the least

    # Scale up settings (rapid response to load spikes)
    scaleUp:
      stabilizationWindowSeconds: 0  # No delay for scaling up
      policies:
        - type: Percent
          value: 100  # Can double pod count
          periodSeconds: 30
        - type: Pods
          value: 4    # Or add 4 pods
          periodSeconds: 30
        - type: Pods
          value: 10   # Max burst: add 10 pods
          periodSeconds: 60
      selectPolicy: Max  # Use the most aggressive policy

---
# Service for exposing custom metrics endpoint
apiVersion: v1
kind: Service
metadata:
  name: cre-autoscaling-metrics
  namespace: cre-prod
  labels:
    app: cre
    component: autoscaling-metrics
  annotations:
    description: "CRE Custom Autoscaling Metrics Endpoint"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
  selector:
    app: cre
    component: workflow-engine

---
# ServiceMonitor for Prometheus Operator (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cre-autoscaling
  namespace: cre-prod
  labels:
    app: cre
    component: autoscaling-metrics
spec:
  selector:
    matchLabels:
      app: cre
      component: workflow-engine
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      scheme: http
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: instance
          replacement: 'cre'
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

---
