---
# Staging HPA with Custom Metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cre-hpa-custom-metrics
  namespace: cre-staging
  labels:
    app: cre
    environment: staging
    autoscaling: custom-metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cre
  # Lower limits for staging (cost optimization)
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Pods
      pods:
        metric:
          name: active_workflows
        target:
          type: AverageValue
          averageValue: "30"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

---
# PodDisruptionBudget for graceful scaling
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cre-autoscaling-pdb
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cre
      component: workflow-engine

---
# ConfigMap for Prometheus Adapter rules
# This configures the Prometheus Adapter to expose CRE metrics to HPA
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-cre-rules
  namespace: cre-prod
  labels:
    app: cre
    component: autoscaling-metrics
data:
  rules.yaml: |
    # External metrics for CRE autoscaling
    - seriesQuery: 'cre_autoscaling_active_workflows'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "cre_autoscaling_(.+)"
        as: "cre_${1}"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    - seriesQuery: 'cre_autoscaling_workflow_queue_depth'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "cre_autoscaling_(.+)"
        as: "cre_${1}"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    - seriesQuery: 'cre_autoscaling_erlang_process_count'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "cre_autoscaling_(.+)"
        as: "cre_${1}"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    - seriesQuery: 'cre_autoscaling_mnesia_table_size'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "cre_autoscaling_(.+)"
        as: "cre_${1}"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
