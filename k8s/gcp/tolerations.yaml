---
# GKE Spot VM Tolerations and Affinity Configuration
#
# This file defines pod tolerations and affinity rules for Spot VM workloads.
# Stateful pods should NOT tolerate Spot VM taints (run on regular nodes only).
# Stateless pods CAN tolerate Spot VM taints for cost optimization.
#
# @doc Spot VM Tolerations and Workload Separation
# @end
# -------------------------------------------------------------------

---
# Priority Classes for CRE Workloads
#
# Stateful workloads get higher priority to ensure they run on regular nodes.
# Stateless workloads get lower priority and can use Spot VMs.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cre-stateful-high
  labels:
    app: cre
    component: workflow-engine
    workload-type: stateful
value: 1000
globalDefault: false
description: "High priority for stateful CRE pods that must run on regular nodes"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cre-stateful-medium
  labels:
    app: cre
    component: workflow-engine
    workload-type: stateful
value: 500
globalDefault: false
description: "Medium priority for stateful CRE pods"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cre-stateless-low
  labels:
    app: cre
    component: workflow-engine
    workload-type: stateless
value: -100
globalDefault: false
description: "Low priority for stateless CRE pods that can run on Spot VMs"

---
# Production Deployment with Spot VM Tolerations (Stateless)
# This deployment runs on Spot VMs for cost savings
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cre-spot
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
    workload-type: spot
  annotations:
    description: "Stateless CRE workload on Spot VMs for cost optimization"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cre
      component: workflow-engine
      workload-type: spot
  template:
    metadata:
      labels:
        app: cre
        component: workflow-engine
        workload-type: spot
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4142"
        prometheus.io/path: "/metrics"
        # GKE-specific annotations
        autoscaling.gke.io/safe-to-evict: "true"
        cloud.google.com/local-ssd-disk: "false"
    spec:
      # Priority class for Spot VM pods
      priorityClassName: cre-stateless-low

      # Service account
      serviceAccountName: cre-ksa

      # Tolerations for Spot VM taint
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoExecute"

      # Node affinity for Spot VM node pool
      affinity:
        # Pod anti-affinity to distribute Spot VM pods
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [cre]
                    - key: workload-type
                      operator: In
                      values: [spot]
                topologyKey: kubernetes.io/hostname
        # Node affinity for Spot VM nodes
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values: ["true"]
                  - key: node-pool
                    operator: In
                    values: ["cre-spot-pool", "spot-pool"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: cloud.google.com/machine-family
                    operator: In
                    values: ["e2"]

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Init containers
      initContainers:
        - name: init-directories
          image: gcr.io/google-containers/busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/cre/data /opt/cre/log /opt/cre/checkpoints
              chown -R 1000:1000 /opt/cre
          volumeMounts:
            - name: data
              mountPath: /opt/cre/data
            - name: logs
              mountPath: /opt/cre/log
            - name: checkpoints
              mountPath: /opt/cre/checkpoints
          securityContext:
            runAsNonRoot: true
            runAsUser: 0

      containers:
        - name: cre
          image: us-central1-docker.pkg.dev/REPLACE_WITH_YOUR_PROJECT_ID/cre/cre:0.3.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4142
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: 9100
              protocol: TCP

          env:
            - name: CRE_DEFAULT_PORT
              value: "4142"
            - name: CRE_LOG_LEVEL
              value: "info"
            - name: CRE_WORKLOAD_TYPE
              value: "stateless"
            - name: CRE_SPOT_VM
              value: "true"
            - name: CRE_SHUTDOWN_TIMEOUT
              value: "25000"
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: cre-secrets
                  key: erlang-cookie
            - name: GOOGLE_CLOUD_PROJECT
              value: "REPLACE_WITH_YOUR_PROJECT_ID"
            - name: ERLANG_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "cre-workflow-engine-spot"

          # Smaller resource limits for Spot VMs (e2-medium)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1800m"
              memory: "3500Mi"
              ephemeral-storage: "4Gi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          startupProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          volumeMounts:
            - name: data
              mountPath: /opt/cre/data
            - name: logs
              mountPath: /opt/cre/log
            - name: checkpoints
              mountPath: /opt/cre/checkpoints

          # Faster shutdown for Spot VM preemption
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    /opt/cre/bin/cre stop &
                    sleep 10

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: data
          emptyDir:
            sizeLimit: "512Mi"
        - name: logs
          emptyDir:
            sizeLimit: "512Mi"
        - name: checkpoints
          emptyDir:
            sizeLimit: "256Mi"

      # Shorter termination grace period for Spot VMs
      terminationGracePeriodSeconds: 25

---
# Production StatefulSet (Regular Nodes Only)
# Stateful workloads MUST run on regular nodes, not Spot VMs
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cre-stateful
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
    workload-type: stateful
  annotations:
    description: "Stateful CRE workload on regular nodes for data persistence"
spec:
  serviceName: cre-stateful-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: cre
      component: workflow-engine
      workload-type: stateful
  template:
    metadata:
      labels:
        app: cre
        component: workflow-engine
        workload-type: stateful
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4142"
        prometheus.io/path: "/metrics"
    spec:
      # High priority to prevent Spot VM preemption
      priorityClassName: cre-stateful-high

      serviceAccountName: cre-ksa

      # NO tolerations for Spot VM taint - ensures regular nodes only
      tolerations:
        # Only tolerate critical pods, not Spot VM taints
        - key: "CriticalAddonsOnly"
          operator: "Exists"

      # Node affinity for regular (non-Spot) nodes
      affinity:
        # Pod anti-affinity for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [cre]
                    - key: workload-type
                      operator: In
                      values: [stateful]
                topologyKey: kubernetes.io/hostname
        # Node affinity: prefer non-Spot VM nodes
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Require non-Spot VM nodes
                  - key: cloud.google.com/gke-spot
                    operator: DoesNotExist
                  - key: cloud.google.com/machine-family
                    operator: In
                    values: ["e2"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-pool
                    operator: In
                    values: ["cre-stateful-pool", "default-pool", "regular-pool"]

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: init-mnesia
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "Initializing Mnesia data directory..."
              mkdir -p /opt/cre/data/mnesia
              chown -R 1000:1000 /opt/cre/data
              chmod -R 755 /opt/cre/data
              echo "Mnesia data directory initialized"
          volumeMounts:
            - name: mnesia-data
              mountPath: /opt/cre/data

      containers:
        - name: cre
          image: us-central1-docker.pkg.dev/REPLACE_WITH_YOUR_PROJECT_ID/cre/cre:0.3.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4142
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: 9100
              protocol: TCP

          env:
            - name: CRE_DEFAULT_PORT
              value: "4142"
            - name: CRE_LOG_LEVEL
              value: "info"
            - name: CRE_WORKLOAD_TYPE
              value: "stateful"
            - name: CRE_SPOT_VM
              value: "false"
            - name: CRE_SHUTDOWN_TIMEOUT
              value: "30000"
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: cre-secrets
                  key: erlang-cookie
            - name: GOOGLE_CLOUD_PROJECT
              value: "REPLACE_WITH_YOUR_PROJECT_ID"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ERLANG_NODE
              value: "cre-stateful-$(POD_NAME).cre-stateful-headless.cre-prod.svc.cluster.local"
            - name: MNESIA_DIR
              value: "/opt/cre/data/mnesia"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "cre-workflow-engine-stateful"

          # Larger resource limits for stateful workloads
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
              ephemeral-storage: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              ephemeral-storage: "10Gi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          volumeMounts:
            - name: mnesia-data
              mountPath: /opt/cre/data
            - name: checkpoints
              mountPath: /opt/cre/checkpoints

          # Standard shutdown for stateful workloads
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    /opt/cre/bin/cre stop &
                    sleep 20

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: cre-checkpoints-pvc

      # Longer termination grace period for stateful workloads
      terminationGracePeriodSeconds: 30

  volumeClaimTemplates:
    - metadata:
        name: mnesia-data
        labels:
          app: cre
          workload-type: stateful
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard-rwo

---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: cre-stateful-headless
  namespace: cre-prod
  labels:
    app: cre
    component: workflow-engine
    workload-type: stateful
spec:
  clusterIP: None
  selector:
    app: cre
    component: workflow-engine
    workload-type: stateful
  ports:
    - name: http
      port: 4142
      targetPort: http
      protocol: TCP
    - name: epmd
      port: 4369
      targetPort: epmd
      protocol: TCP
    - name: dist
      port: 9100
      targetPort: dist
      protocol: TCP

---
# Staging Spot Deployment (Stateless)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cre-spot
  namespace: cre-staging
  labels:
    app: cre
    component: workflow-engine
    environment: staging
    workload-type: spot
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cre
      workload-type: spot
  template:
    metadata:
      labels:
        app: cre
        workload-type: spot
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4142"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: cre-stateless-low
      serviceAccountName: cre-ksa

      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values: ["true"]

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: cre
          image: us-central1-docker.pkg.dev/REPLACE_WITH_YOUR_PROJECT_ID/cre/cre:0.3.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4142
            - name: epmd
              containerPort: 4369
            - name: dist
              containerPort: 9100
          env:
            - name: CRE_DEFAULT_PORT
              value: "4142"
            - name: CRE_LOG_LEVEL
              value: "debug"
            - name: CRE_WORKLOAD_TYPE
              value: "stateless"
            - name: CRE_SPOT_VM
              value: "true"
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: cre-secrets
                  key: erlang-cookie
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    /opt/cre/bin/cre stop &
                    sleep 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      terminationGracePeriodSeconds: 25
